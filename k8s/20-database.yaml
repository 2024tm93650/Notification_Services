apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notification-db-pvc
  namespace: ticketing
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-db
  namespace: ticketing
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-db }
  template:
    metadata:
      labels: { app: notification-db }
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_DB
              value: notification_db
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: notification-secrets, key: DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: notification-secrets, key: DB_PASSWORD } }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: notification-db-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-db
  namespace: ticketing
spec:
  selector: { app: notification-db }
  ports:
    - port: 5432
      targetPort: 5432
