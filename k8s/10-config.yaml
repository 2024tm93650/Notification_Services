apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: ticketing
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  DB_ENGINE: "postgres"
  DB_NAME: "notification_db"
  DB_HOST: "notification-db"
  DB_PORT: "5432"
  EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
  EMAIL_HOST: "sandbox.smtp.mailtrap.io"
  EMAIL_PORT: "2525"
  EMAIL_USE_TLS: "True"
  DEFAULT_FROM_EMAIL: "no-reply@ticketing.local"
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-secrets
  namespace: ticketing
type: Opaque
stringData:
  SECRET_KEY: "replace-with-strong-random-key"
  DB_USER: "postgres"
  DB_PASSWORD: "postgres"
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
